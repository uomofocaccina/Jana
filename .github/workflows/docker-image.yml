name: Docker Image CI

on:
  push:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag uomofocaccin/jana
    - name: Push Docker image
      run: docker push uomofocaccin/jana

  carica:
    needs: build
    runs-on: [self-hosted, Linux, X64,jana]
    steps:
      - name: Esegui comando sul runner Linux-deb1
        run: /home/github/jana.sh
