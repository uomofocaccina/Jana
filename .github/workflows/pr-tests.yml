name: Pull Request Tests

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'backend/**'
      - '.github/workflows/pr-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore backend/JanaApi.sln
    
    - name: Build
      run: dotnet build backend/JanaApi.sln --no-restore --configuration Release
    
    - name: Test
      run: dotnet test backend/JanaApi.sln --no-build --configuration Release --verbosity normal --logger trx --results-directory TestResults
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/*.trx